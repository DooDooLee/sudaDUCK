# 부하 테스트용 A(Tomcat) 컨테이너 설정. bench/docker-compose.yml 이 /app/config/application.yaml 로 마운트한다.
# 비밀값은 넣지 않는다. JWT_SECRET 은 bench/.env 에서 환경변수로 들어온다.
# 외부 서비스(카카오, Azure, OpenVidu)는 더미 값이라 해당 기능은 실패하지만 앱 기동과 AI 채팅에는 지장 없다.
spring:
  application:
    name: DuckDuck-Bench
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/duckduck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            # 더미. OAuth2 클라이언트 자동 설정이 뜨기만 하면 된다
            client-id: bench-dummy-client-id
            client-secret: bench-dummy-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:18080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  # A 와 B 가 같은 키여야 토큰이 서로 통한다
  secret: ${JWT_SECRET}
  access-token-expiration-period: 3600000
  refresh-token-expiration-period: 1209600000

azure:
  speech:
    key: bench-dummy
    region: koreacentral

openvidu:
  url: http://localhost:4443
  secret: bench-dummy

OPENVIDU_URL: http://localhost:4443
OPENVIDU_SECRET: bench-dummy

gms:
  token: unused

openai:
  api:
    # 실제 OpenAI 대신 mock-gpt 로 보낸다
    base-url: ${OPENAI_BASE_URL:http://mock-gpt:9000}
    key: ${OPENAI_API_KEY:dummy}
  model: ${OPENAI_MODEL:gpt-4o-mini}

custom:
  api-prefix: ""
  oauth2:
    redirect-url: http://localhost:5173/oauth2/redirect

logging:
  level:
    root: INFO
    com.example.DuckDuck: INFO
    org.springframework.data.redis: WARN

# 메트릭 노출 (Prometheus 수집)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: duckduck-tomcat
    distribution:
      # 서버 측 p95 를 histogram_quantile 로 계산하기 위해 버킷을 노출한다
      percentiles-histogram:
        http.server.requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true   # tomcat_threads_* 지표에 필요
