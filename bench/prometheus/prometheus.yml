# 5초 간격으로 A, B, mock-gpt 를 수집한다. 컨테이너끼리는 서비스 이름으로 통신한다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: app-a
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-a:8080"]

  - job_name: app-b
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-b:8081"]

  - job_name: mock-gpt
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-gpt:9000"]
